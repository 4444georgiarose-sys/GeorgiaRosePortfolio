<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Georgia Rose Photography</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg:    #e7e2e0;
      --ink:   #000;
      --muted: #666;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      height: 133px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .logo {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 400;
      letter-spacing: 0.08em;
      font-size: clamp(0.9rem, 1.6vw, 1.3rem);
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 100px;
    }

    .content {
      max-width: 560px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.9s ease 0.2s forwards;
    }

    .eyebrow {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 200;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .divider {
      width: 40px;
      height: 0.5px;
      background: var(--ink);
      margin-bottom: 28px;
      opacity: 0.3;
    }

    p {
      font-size: 15.83px;
      font-weight: 300;
      line-height: 28.49px;
      color: var(--muted);
      max-width: 420px;
    }

    /* ── Footer ── */
    footer {
      padding: 32px 100px;
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Animation ── */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      header, main, footer {
        padding-left: 40px;
        padding-right: 40px;
      }
      header {
        height: 80px;
      }
    }

    @media (max-width: 680px) {
      header, main, footer {
        padding-left: 24px;
        padding-right: 24px;
      }
      header {
        height: 64px;
      }
      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">Georgia Rose Photography</span>
  </header>

  <main>
    <div class="content">
      <p class="eyebrow">Currently Updating</p>
      <h1>Back Soon</h1>
      <div class="divider"></div>
      <p>The site is undergoing some improvements. Please check back shortly.</p>
    </div>
  </main>

  <footer>
    <span>Georgia Rose Photography</span>
    <span>&copy; 2026</span>
  </footer>

</body>
</html>
